# 넙치 질병 탐지 시스템 - 클래스 및 매핑 설정

# Stage 2: 다중 증상 분류 클래스
symptom_classes:
  0: normal
  1: hemorrhage      # 출혈 (symptom 1,2)
  2: white_spot      # 백점 (symptom 10)
  3: tumor           # 반점/결절 (symptom 4)
  4: color_change    # 체색변화 (symptom 3)
  5: emaciation      # 여윔 (symptom 22)
  6: ulcer           # 궤양 (symptom 11)

# AIHub symptom 코드 → 클래스 매핑
symptom_code_map:
  1: hemorrhage       # 출혈_체표
  2: hemorrhage       # 출혈_지느러미
  3: color_change     # 체색변화
  4: tumor            # 반점/결절
  6: null             # 안구돌출 (제외)
  8: null             # 복부팽만 (제외)
  9: null             # 아가미이상 (제외)
  10: white_spot      # 백점
  11: ulcer           # 궤양
  12: ulcer           # 지느러미부식 → 궤양으로 통합
  22: emaciation      # 여윔
  29: null            # 기타증상 (제외)

# 클래스별 데이터 밸런싱 목표
balance_targets:
  normal: 2000
  hemorrhage: 2000
  white_spot: 2000
  tumor: 1518         # 전체 사용
  color_change: 2000
  emaciation: 134     # 전체 사용
  ulcer: 274          # 전체 사용

# 증상 → 질병 매핑
symptom_disease_map:
  white_spot:
    - name: Scuticociliatosis
      probability: 0.7
      contagious: true
      pathogen: "Ciliate Miamiensis avidus"
      lethal: true
      mortality_rate: "50-90%"
    - name: White spot disease
      probability: 0.3
      contagious: true
      pathogen: "Ciliate Cryptocaryon irritans"
      lethal: true
      mortality_rate: "30-70%"
  hemorrhage:
    - name: VHS (Viral Hemorrhagic Septicemia)
      probability: 0.4
      contagious: true
      pathogen: "VHS virus (Novirhabdovirus)"
      lethal: true
      mortality_rate: "30-70%"
    - name: Vibriosis
      probability: 0.35
      contagious: true
      pathogen: "Vibrio anguillarum and other Vibrio spp."
      lethal: true
      mortality_rate: "20-50%"
    - name: Streptococcosis
      probability: 0.25
      contagious: true
      pathogen: "Streptococcus iniae/parauberis"
      lethal: true
      mortality_rate: "20-40%"
  color_change:
    - name: Scuticociliatosis
      probability: 0.4
      contagious: true
      pathogen: "Ciliate Miamiensis avidus"
      lethal: true
      mortality_rate: "50-90%"
    - name: Vibriosis
      probability: 0.35
      contagious: true
      pathogen: "Vibrio bacteria"
      lethal: true
      mortality_rate: "20-50%"
    - name: Stress-induced color change
      probability: 0.25
      contagious: false
      pathogen: "None (environmental stress)"
      lethal: false
      mortality_rate: "Low"
  tumor:
    - name: Lymphocystis disease
      probability: 0.9
      contagious: false
      pathogen: "Lymphocystivirus (family Iridoviridae)"
      lethal: false
      mortality_rate: "<1%"
  ulcer:
    - name: Vibriosis
      probability: 0.6
      contagious: true
      pathogen: "Vibrio anguillarum/vulnificus"
      lethal: true
      mortality_rate: "20-50%"
    - name: Edwardsiellosis
      probability: 0.4
      contagious: true
      pathogen: "Edwardsiella tarda"
      lethal: true
      mortality_rate: "30-60%"
  emaciation:
    - name: Emaciation disease
      probability: 0.5
      contagious: false
      pathogen: "None (malnutrition, chronic stress)"
      lethal: false
      mortality_rate: "<10%"
    - name: Internal parasite infection
      probability: 0.3
      contagious: false
      pathogen: "Gut parasites (e.g., nematodes)"
      lethal: false
      mortality_rate: "10-20%"
    - name: Chronic bacterial infection
      probability: 0.2
      contagious: true
      pathogen: "Various bacteria (chronic)"
      lethal: true
      mortality_rate: "10-30%"

# Disease → response guide
disease_response:
  Scuticociliatosis:
    action: LOWER_TEMPERATURE
    temperature: "Lower below 18°C immediately"
    urgency: immediate
    isolate: true
    steps:
      - "Immediately isolate infected fish in a separate tank"
      - "Lower water temperature below 18°C (suppresses ciliate growth)"
      - "Formalin bath at 100 ppm for 30-60 min"
      - "Reduce stocking density (overcrowding is the main cause)"
      - "Fully replace tank water + disinfect equipment"
      - "Do not share nets/hoses between tanks"
    warning: "Mortality 50-90%. Spreads very fast; can transmit within the same tank in hours."
  VHS (Viral Hemorrhagic Septicemia):
    action: RAISE_TEMPERATURE
    temperature: "Raise above 20°C"
    urgency: immediate
    isolate: true
    steps:
      - "Immediately isolate the infected tank (tank-level isolation)"
      - "Raise temperature above 20°C (mortality drops sharply above 15°C)"
      - "Antibiotics are ineffective (viral) — temperature control is key"
      - "Fully disinfect drainage/equipment of the infected tank"
      - "Remove dead fish immediately (prevents viral spread)"
      - "Stop or reduce feeding"
    warning: "Notifiable disease. Mortality 30-70%. Concentrated in cold season (10-15°C). No vaccine."
  Vibriosis:
    action: ISOLATE_AND_TREAT
    temperature: "Keep below 25°C"
    urgency: danger
    isolate: true
    steps:
      - "Immediately isolate infected fish"
      - "Oral antibiotics: oxytetracycline 50 mg/kg body weight, 5-7 days"
      - "Or florfenicol 10 mg/kg body weight, 5 days"
      - "Keep temperature below 25°C (high temp accelerates bacterial growth)"
      - "Strengthen water quality management — check ammonia and nitrite"
      - "Add immune boosters (vitamin C, etc.) to feed"
      - "Keep the tank clean to prevent secondary wound infection"
    warning: "Common in warm season (above 25°C). Mortality 20-50%. Spreads via shared equipment."
  Streptococcosis:
    action: ISOLATE_AND_TREAT
    temperature: "Maintain"
    urgency: danger
    isolate: true
    steps:
      - "Immediately isolate infected fish"
      - "Antibiotics: amoxicillin or erythromycin"
      - "Avoid sudden temperature changes (cause of weakened immunity)"
      - "Reduce stocking density"
      - "Adjust feeding amount (reduce digestive burden)"
    warning: "Common in warm season (above 20°C). Mortality 20-40%. May involve exophthalmia and abdominal swelling."
  Lymphocystis disease:
    action: MONITOR
    temperature: "Maintain"
    urgency: watch
    isolate: false
    steps:
      - "Isolation unnecessary — low contagiousness and near-zero lethality"
      - "Self-healing possible (resolves naturally over weeks to months)"
      - "Remove stress factors (overcrowding, poor water quality, sudden changes)"
      - "Focus on water quality — monitor dissolved oxygen, pH, ammonia"
      - "Separate severe individuals for appearance issues at shipping"
      - "No specific treatment"
    warning: "Lethality below 1%. Main issue is reduced market value. May recur under stress."
  Emaciation disease:
    action: IMPROVE_NUTRITION
    temperature: "Maintain"
    urgency: watch
    isolate: false
    steps:
      - "Isolation unnecessary — non-contagious"
      - "Check feed quality/amount/frequency"
      - "Feed weak individuals separately and sufficiently"
      - "Reduce stocking density (weak fish lose feeding competition)"
      - "Test for internal parasites (gut parasites may be the cause)"
      - "Feed vitamin/mineral-supplemented feed"
    warning: "Non-contagious but can be fatal if neglected. Improving the feeding-competition environment is key."
  White spot disease:
    action: TREAT
    temperature: "Gradually raise (25-28°C)"
    urgency: danger
    isolate: true
    steps:
      - "Isolate infected fish"
      - "Gradually raise temperature to 25-28°C (accelerates parasite life cycle → boosts bath efficacy)"
      - "Formalin bath 100-200 ppm for 30-60 min"
      - "Or use copper-based medication"
      - "Repeat bath every 3-5 days (matched to parasite life cycle)"
      - "Strengthen water quality management, thorough water changes"
    warning: "Highly contagious. Mortality 30-70%. Raising temperature + bath together is most effective."
  Other:
    action: MONITOR
    temperature: "Maintain"
    urgency: watch
    isolate: false
    steps:
      - "Full water test (temperature, pH, ammonia, dissolved oxygen, salinity)"
      - "Check feed/environment change history"
      - "Record symptom changes daily"
      - "Request expert diagnosis if it worsens within 48 hours"
    warning: "Cause unknown. Observe, but consult a fish veterinarian immediately if it worsens."
  Edwardsiellosis:
    action: ISOLATE_AND_TREAT
    temperature: "Keep below 25°C"
    urgency: danger
    isolate: true
    steps:
      - "Immediately isolate infected fish"
      - "Antibiotics: florfenicol 10 mg/kg body weight, 5-7 days"
      - "Or oral oxytetracycline"
      - "Keep temperature below 25°C (high temp accelerates bacterial growth)"
      - "Remove dead fish immediately (prevents bacterial spread in water)"
      - "No cross-use of equipment between tanks"
    warning: "Causes internal hemorrhage and septicemia. Mortality 30-60%. Common in warm season (above 25°C)."
  Internal parasite infection:
    action: TREAT
    temperature: "Maintain"
    urgency: watch
    isolate: false
    steps:
      - "Confirm via microscopic exam of gut parasites"
      - "Oral anthelmintic such as praziquantel"
      - "Mix into feed (dose by body weight)"
      - "Recheck after 2 weeks to confirm efficacy"
    warning: "Non-contagious but chronically stunts growth. Regular deworming is important."
  Chronic bacterial infection:
    action: ISOLATE_AND_TREAT
    temperature: "Maintain"
    urgency: danger
    isolate: true
    steps:
      - "Isolate infected fish"
      - "Administer an appropriate antibiotic after sensitivity testing"
      - "Strengthen water quality management"
      - "Feed immune-boosting feed"
    warning: "Chronic infection risks antibiotic resistance. Sensitivity testing is essential."

# 위험도 점수 (증상별 심각도)
symptom_severity:
  normal: 0
  color_change: 2
  emaciation: 2
  tumor: 3
  hemorrhage: 4
  white_spot: 4
  ulcer: 5

# 질병 + 수온 조합 규칙 (질병 감지 시 온도에 따라 추가 경보)
disease_temperature_rules:
  스쿠티카병:
    condition: ">="
    threshold: 20
    alert: "수온이 높아 스쿠티카병 증식 가속. 즉시 18도 이하로 낮추세요."
    urgency: immediate
  VHS(바이러스성출혈성패혈증):
    condition: "<="
    threshold: 15
    alert: "저수온 환경에서 VHS 확산 위험. 20도 이상으로 올리세요."
    urgency: immediate
  비브리오병:
    condition: ">="
    threshold: 25
    alert: "고수온 환경에서 비브리오균 증식 가속. 수온 낮추고 항생제 투여 검토."
    urgency: danger
  에드워드병:
    condition: ">="
    threshold: 25
    alert: "고수온에서 에드워드균 증식 위험. 수온 관리 강화."
    urgency: danger

# 수질 정상 범위 (넙치 기준)
water_quality_thresholds:
  temperature:
    min: 16
    max: 22
    unit: "°C"
    low_alert: "저수온 주의 - VHS·에드워드병 발병 위험"
    high_alert: "고수온 주의 - 스쿠티카병·비브리오병 위험"
  do:
    min: 7.0
    max: 12.0
    unit: "mg/L"
    low_alert: "용존산소 부족 - 폐사 위험, 즉시 환기 필요"
    high_alert: "용존산소 과포화 - 기포병 주의"
  ph:
    min: 7.0
    max: 8.5
    unit: ""
    low_alert: "pH 낮음 - 산성화로 면역력 저하"
    high_alert: "pH 높음 - 아가미 손상 가능"
  salinity:
    min: 28
    max: 35
    unit: "ppt"
    low_alert: "염도 낮음 - 삼투압 스트레스"
    high_alert: "염도 높음 - 탈수 스트레스"

# 위험도 등급 기준
risk_thresholds:
  watch: 1.5       # score >= 1.5
  danger: 3.0      # score >= 3.0
  immediate: 4.0   # score >= 4.0
  tank_disease_ratio_danger: 0.15
  tank_disease_ratio_immediate: 0.30
